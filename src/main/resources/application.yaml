spring:
  application:
    name: comzhichi-backend-develop

  datasource:
    driver-class-name: org.postgresql.Driver
    # ── Conexión local (activa) ──────────────────────────────────────────────
    url: jdbc:postgresql://localhost:5432/db_comzhichi
    username: postgres
    password: adminadmin
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
    # ── Supabase (comentado hasta despliegue en producción) ──────────────────
    # url: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres
    # username: postgres.kslokrehwebouzuljdti
    # password: comzhichiadmin
    # hikari:
    #   maximum-pool-size: 3
    #   minimum-idle: 1

  jpa:
    database: postgresql
    defer-datasource-initialization: true # Ejecuta data.sql DESPUÉS de que Hibernate cree las tablas
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  port: 8080

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: "http://localhost:4200,http://127.0.0.1:4200"
  security:
    jwt-secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    jwt-expiration-minutes: 60