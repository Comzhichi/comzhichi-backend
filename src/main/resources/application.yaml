  spring:
    application:
      name: comzhichi-backend-develop

  datasource:
    url: jdbc:postgresql://localhost:5432/db_comzhichi
    username: postgres
    password: adminadmin

    servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 5MB

    jpa:
      database: postgresql
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  server:
    port: 8081

server:
  port: 8080

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html

  app:
    cors:
      allowed-origins: "http://localhost:4200"
    security:
      jwt-secret: ${JWT_SECRET}
      jwt-expiration-minutes: 60
    supabase:
      url: ${SUPABASE_URL}
      bucket: event-images
      key: ${SUPABASE_SERVICE_ROLE_KEY}