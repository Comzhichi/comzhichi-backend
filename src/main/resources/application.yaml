spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: comzhichi-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_comzhichi}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:adminadmin}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1

  jpa:
    database: postgresql
    defer-datasource-initialization: true # Ejecuta data.sql DESPUÉS de que Hibernate cree las tablas
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-3.8-flash
          temperature: 0
          thinking:
            type: disabled

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  security:
    jwt-secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}